<ion-content class="ion-padding">
  
  <div class="button-container">
    <ion-button (click)="refreshData()" expand="block" color="primary" class="refresh-btn">
      Refresh
    </ion-button>
  </div>

  <ion-grid>
    <ion-row *ngFor="let item of cryptoData" class="crypto-card">
      
      <ion-col size="3" class="ion-text-center">
        <span class="label-text">Rank</span>
        <div class="value-text bold-text">{{ item.rank }}</div>
      </ion-col>
      
      <ion-col size="5" class="ion-padding-start">
        <span class="label-text">{{ item.name }}</span>
        <div class="value-text bold-text">{{ item.symbol }}</div>
      </ion-col>
      
      <ion-col size="4" class="ion-text-end">
        <span class="label-text">USD</span>
        <div class="value-text price-text">{{ item.price_usd }}</div>
      </ion-col>
      
    </ion-row>
  </ion-grid>

</ion-content>
